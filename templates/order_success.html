<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Yeh line mobile view theek karti hai -->
    <title>Order Success - Prizeless Store</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .success-card {
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
            text-align: center;
            width: 100%;
            max-width: 400px; /* Mobile par apne aap set ho jayega */
        }
        .success-icon {
            font-size: 50px;
            color: #28a745;
            margin-bottom: 15px;
        }
        h2 {
            color: #333;
            margin-bottom: 10px;
            font-size: 24px;
        }
        p {
            color: #666;
            margin-bottom: 5px;
            font-size: 15px;
        }
        .order-id {
            font-weight: bold;
            color: #ff8c00;
            margin: 15px 0;
            font-size: 18px;
        }
        .btn-home {
            display: inline-block;
            background: #ff8c00;
            color: white;
            padding: 14px 20px;
            text-decoration: none;
            border-radius: 8px;
            margin-top: 20px;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="success-card">
        <div class="success-icon">✅</div>
        <h2>Order Placed Successfully!</h2>
        <p>Thank you for shopping with Prizeless Store</p>
        
        <div class="order-id">ORDER ID: #PRZ-00{{ order_id }}</div>
        
        <p style="font-size: 13px; background: #eef2f7; padding: 10px; border-radius: 5px; margin-top: 15px;">
            We will process your order soon.
        </p>
        
        <a href="{% url 'home' %}" class="btn-home">Return to Home Store 🏠</a>
    </div>

</body>
</html>
