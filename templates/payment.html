<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment - Prizeless Store</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 6px 15px rgba(0,0,0,0.1); max-width: 400px; width: 100%; text-align: center; box-sizing: border-box; }
        .option-box { display: block; border: 1px solid #ddd; padding: 15px; margin-bottom: 10px; border-radius: 8px; text-align: left; cursor: pointer; background: #fafafa; font-size: 15px; }
        .option-box input { margin-right: 10px; }
        .btn-pay { background: #ff8c00; color: white; padding: 14px; border: none; border-radius: 8px; width: 100%; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; }
        .btn-pay:hover { background: #e07b00; }
        .qr-img { border: 2px solid #eee; padding: 10px; border-radius: 10px; margin: 15px 0; background: #fff; }
    </style>
</head>
<body>

<div class="card">
    {% if step == 'selection' %}
        <h2 style="margin-top: 0; border-bottom: 2px solid #eee; padding-bottom: 10px;">2. Select Payment</h2>
        <p style="color: #666; font-size: 18px;">Total Payable: <strong style="color: #28a745;">₹{{ order.total_amount }}</strong></p>
        
        <form method="POST">
            {% csrf_token %}
            <input type="hidden" name="action" value="select_method">
            
            <label class="option-box">
                <input type="radio" name="payment_method" value="UPI" required> 📱 Scan QR (UPI / GPay)
            </label>
            <label class="option-box">
                <input type="radio" name="payment_method" value="Card"> 💳 Credit / Debit Card
            </label>
            <label class="option-box">
                <input type="radio" name="payment_method" value="NetBanking"> 🏦 Net Banking
            </label>
            <label class="option-box">
                <input type="radio" name="payment_method" value="COD"> 💵 Cash on Delivery (COD)
            </label>
            
            <button type="submit" class="btn-pay">Place Order</button>
        </form>

    {% elif step == 'qr' %}
        <h2 style="margin-top: 0;">Scan to Pay</h2>
        <h1 style="color: #28a745; margin: 10px 0;">₹{{ order.total_amount }}</h1>
        <p style="font-size: 14px;">Paying to: <strong>Prizeless Store</strong></p>
        
        <img src="{{ qr_url }}" alt="UPI QR Code" class="qr-img" width="200" height="200">
        
        <form method="POST">
            {% csrf_token %}
            <input type="hidden" name="action" value="confirm_upi">
            <button type="submit" class="btn-pay">I have done my payment ✅</button>
        </form>
    {% endif %}
</div>

</body>
</html>
