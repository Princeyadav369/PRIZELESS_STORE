<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Product - Prizeless Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 flex items-center justify-center min-h-screen p-6">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-[500px] border border-gray-200">
        <h1 class="text-2xl font-bold mb-2 text-center text-gray-900">Edit Product</h1>
        <p class="text-gray-500 text-sm mb-6 text-center">Update details for <span class="font-bold text-blue-600">{{ product.name }}</span></p>

        <!-- enctype="multipart/form-data" zaroori hai photo upload/update ke liye -->
        <form method="POST" enctype="multipart/form-data" class="space-y-4">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition shadow-lg mt-4">
                Update Product
            </button>
        </form>
        
        <div class="mt-4 text-center">
            <a href="/custom-dashboard/" class="text-sm text-gray-500 hover:text-gray-900">&larr; Back to Dashboard</a>
        </div>
    </div>

</body>
</html>
