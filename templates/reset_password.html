<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password - Prizeless Store</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #121212; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: rgba(30, 30, 30, 0.85); padding: 40px; border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); width: 100%; max-width: 400px; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); color: #fff; box-sizing: border-box; }
        h2 { text-align: center; margin-bottom: 10px; color: #ffca28; }
        p.subtitle { text-align: center; color: #aaa; font-size: 14px; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 14px; color: #ccc; }
        input { width: 100%; padding: 12px; background: #2a2a2a; border: 1px solid #444; border-radius: 6px; color: #fff; font-size: 16px; box-sizing: border-box; }
        input:focus { border-color: #ffca28; outline: none; }
        .btn-submit { width: 100%; padding: 12px; background: linear-gradient(135deg, #ffca28, #ffa000); border: none; border-radius: 6px; color: #121212; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .error-msg { background: rgba(255,0,0,0.2); color: #ff6b6b; padding: 10px; border-radius: 5px; margin-bottom: 15px; text-align: center; font-size: 14px; }
        .success-msg { background: rgba(0,255,0,0.2); color: #6bff6b; padding: 10px; border-radius: 5px; margin-bottom: 15px; text-align: center; font-size: 14px; }
    </style>
</head>
<body>
<div class="login-card">
    <h2>New Password</h2>
    <p class="subtitle">Create a strong new password</p>
    {% if messages %}{% for message in messages %}
        <div class="{% if message.tags == 'error' %}error-msg{% else %}success-msg{% endif %}">{{ message }}</div>
    {% endfor %}{% endif %}
    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label>New Password</label>
            <input type="password" name="new_password" required placeholder="Enter new password">
        </div>
        <div class="form-group">
            <label>Confirm New Password</label>
            <input type="password" name="confirm_password" required placeholder="Re-enter new password">
        </div>
        <button type="submit" class="btn-submit">Set Password & Login</button>
    </form>
</div>
</body>
</html>
