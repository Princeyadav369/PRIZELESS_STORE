<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Prizeless Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-900">

    <!-- Header -->
    <header class="bg-gray-900 text-white p-4 shadow-md text-center">
        <h1 class="text-2xl font-bold">Secure Checkout</h1>
    </header>

    <div class="max-w-6xl mx-auto p-6 mt-6 grid grid-cols-1 md:grid-cols-2 gap-8">
        
        <!-- Left Side: Address & Payment Form -->
        <div class="bg-white p-6 rounded-xl shadow-lg border border-gray-200">
            <h2 class="text-xl font-bold mb-4 border-b pb-2">1. Delivery Address</h2>
            
            <form method="POST" action="{% url 'checkout' %}" class="space-y-4">
                {% csrf_token %}
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700">First Name</label>
                        <input type="text" name="first_name" required class="w-full bg-gray-50 border border-gray-300 rounded p-2 focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700">Last Name</label>
                        <input type="text" name="last_name" required class="w-full bg-gray-50 border border-gray-300 rounded p-2 focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700">Email</label>
                        <input type="email" name="email" class="w-full bg-gray-50 border border-gray-300 rounded p-2">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700">Phone</label>
                        <input type="text" name="phone" required class="w-full bg-gray-50 border border-gray-300 rounded p-2">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700">Full Address</label>
                    <textarea name="address" required class="w-full bg-gray-50 border border-gray-300 rounded p-2"></textarea>
                </div>

                <div class="grid grid-cols-3 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700">City</label>
                        <input type="text" name="city" required class="w-full bg-gray-50 border border-gray-300 rounded p-2">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700">State</label>
                        <input type="text" name="state" required class="w-full bg-gray-50 border border-gray-300 rounded p-2">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700">Pincode</label>
                        <input type="text" name="pincode" required class="w-full bg-gray-50 border border-gray-300 rounded p-2">
                    </div>
                </div>

                <h2 class="text-xl font-bold mt-8 mb-4 border-b pb-2">2. Payment Method</h2>
                
                <div class="space-y-3">
                    <label class="flex items-center space-x-3 p-3 border rounded-lg cursor-pointer hover:bg-gray-50">
                        <input type="radio" name="payment_method" value="UPI" required class="w-5 h-5 text-blue-600">
                        <span class="font-semibold">UPI / Net Banking / Card</span>
                    </label>
                    <label class="flex items-center space-x-3 p-3 border rounded-lg cursor-pointer hover:bg-gray-50">
                        <input type="radio" name="payment_method" value="COD" required class="w-5 h-5 text-blue-600">
                        <span class="font-semibold">Cash on Delivery (COD)</span>
                    </label>
                </div>

                <button type="submit" class="w-full bg-yellow-500 hover:bg-yellow-600 text-black font-bold py-3.5 rounded-lg transition shadow-lg mt-6 text-lg">
                    Place Order & Pay
                </button>
            </form>
        </div>

        <!-- Right Side: Order Summary -->
        <div class="bg-gray-50 p-6 rounded-xl shadow-lg border border-gray-200 h-fit">
            <h2 class="text-xl font-bold mb-4 border-b pb-2">Order Summary</h2>
            <div class="space-y-4 mb-4">
                {% for item_id, item in cart.items %}
                <div class="flex justify-between text-sm">
                    <span>{{ item.name }} (x{{ item.quantity }})</span>
                    <span class="font-bold">₹{{ item.price }}</span>
                </div>
                {% endfor %}
            </div>
            <div class="border-t pt-4 flex justify-between text-lg font-bold">
                <span>Total Amount:</span>
                <span class="text-red-600">₹{{ total_price }}</span>
            </div>
        </div>

    </div>
</body>
</html>
