<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Videos - Prizeless Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans">

    <div class="flex h-screen overflow-hidden">
        <!-- SIDEBAR -->
        <div class="w-64 bg-white border-r border-gray-200 flex flex-col justify-between hidden md:flex">
            <div>
                <div class="p-6 flex items-center space-x-2">
                    <span class="text-orange-500 text-2xl font-bold">✴</span>
                    <h1 class="text-xl font-bold text-gray-900">Prizeless<span class="text-orange-500">.</span></h1>
                </div>
                <nav class="mt-2 px-4 space-y-1">
                    <a href="{% url 'custom_dashboard' %}" class="flex items-center px-4 py-3 text-gray-600 hover:bg-gray-50 rounded-lg font-medium">📊 Dashboard</a>
                    <a href="{% url 'dashboard_banners' %}" class="flex items-center px-4 py-3 text-gray-600 hover:bg-gray-50 rounded-lg font-medium">🖼️ Home Banners</a>
                    <a href="{% url 'dashboard_videos' %}" class="flex items-center px-4 py-3 bg-orange-50 text-orange-600 rounded-lg font-bold">🎥 Video Reviews</a>
                </nav>
            </div>
            <div class="p-4 border-t">
                <a href="{% url 'custom_logout' %}" class="flex items-center px-4 py-2 text-red-600 font-bold hover:bg-red-50 rounded-lg">🚪 Logout</a>
            </div>
        </div>

        <!-- MAIN CONTENT -->
        <div class="flex-1 flex flex-col overflow-y-auto p-8">
            <h1 class="text-2xl font-bold text-gray-900 mb-6">🎥 Manage Product Video Reviews</h1>

            <!-- ADD VIDEO FORM -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 mb-8 max-w-2xl">
                <h2 class="text-lg font-bold text-gray-800 mb-4">Add New Video</h2>
                <form method="POST" class="space-y-4">
                    {% csrf_token %}
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">Video Title</label>
                        <input type="text" name="title" required placeholder="e.g. Steel Bottle Review" class="w-full border px-3 py-2 rounded-lg text-sm focus:ring-2 focus:ring-orange-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">Thumbnail Image URL</label>
                        <input type="text" name="thumbnail_url" required placeholder="Paste image link" class="w-full border px-3 py-2 rounded-lg text-sm focus:ring-2 focus:ring-orange-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">Video Link (YouTube / MP4)</label>
                        <input type="text" name="video_url" required placeholder="Paste video link" class="w-full border px-3 py-2 rounded-lg text-sm focus:ring-2 focus:ring-orange-500 outline-none">
                    </div>
                    <button type="submit" class="bg-orange-500 hover:bg-orange-600 text-white font-bold px-6 py-2.5 rounded-lg text-sm transition">Upload Video 🚀</button>
                </form>
            </div>

            <!-- EXISTING VIDEOS LIST -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                <h2 class="text-lg font-bold text-gray-800 mb-4">Uploaded Videos</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    {% for v in videos %}
                    <div class="border rounded-lg p-3 relative bg-gray-50 flex flex-col justify-between">
                        <div>
                            <img src="{{ v.thumbnail_url }}" class="w-full h-32 object-cover rounded mb-2">
                            <h3 class="font-bold text-sm text-gray-900 truncate">{{ v.title }}</h3>
                        </div>
                        <form method="POST" action="{% url 'delete_video' v.id %}" class="mt-3">
                            {% csrf_token %}
                            <button type="submit" class="w-full bg-red-50 hover:bg-red-100 text-red-600 font-bold py-1.5 rounded text-xs transition">Delete ❌</button>
                        </form>
                    </div>
                    {% empty %}
                    <p class="text-gray-500 text-sm col-span-3">No videos uploaded yet.</p>
                    {% endfor %}
                </div>
            </div>
        </div>
    </div>
</body>
</html>
