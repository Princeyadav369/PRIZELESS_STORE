<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Prizeless Store</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #121212;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: rgba(30, 30, 30, 0.85);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            box-sizing: border-box;
        }
        h2 { text-align: center; margin-bottom: 10px; color: #ffca28; }
        p.subtitle { text-align: center; color: #aaa; font-size: 14px; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 14px; color: #ccc; }
        input {
            width: 100%;
            padding: 12px;
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 6px;
            color: #fff;
            font-size: 16px;
            box-sizing: border-box;
        }
        input:focus { border-color: #ffca28; outline: none; }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #ffca28, #ffa000);
            border: none;
            border-radius: 6px;
            color: #121212;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-submit:hover { opacity: 0.9; }
        .links { display: flex; justify-content: space-between; margin-top: 15px; font-size: 13px; }
        .links a { color: #4dabf7; text-decoration: none; }
        .links a:hover { text-decoration: underline; }
        .error-msg { background: rgba(255, 0, 0, 0.2); color: #ff6b6b; padding: 10px; border-radius: 5px; margin-bottom: 15px; text-align: center; font-size: 14px; }
        .success-msg { background: rgba(0, 255, 0, 0.2); color: #6bff6b; padding: 10px; border-radius: 5px; margin-bottom: 15px; text-align: center; font-size: 14px; }
        .google-btn {
            width: 100%;
            padding: 12px;
            background: #fff;
            color: #333;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
    </style>
</head>
<body>

<div class="login-card">
    <h2>Welcome to Prizeless</h2>
    <p class="subtitle">Sign in to access your dashboard & orders</p>

    {% if messages %}
        {% for message in messages %}
            {% if message.tags == 'error' %}
                <div class="error-msg">{{ message }}</div>
            {% else %}
                <div class="success-msg">{{ message }}</div>
            {% endif %}
        {% endfor %}
    {% endif %}

    <!-- GLITCH FIX APPLIED HERE -->
    <form method="POST" autocomplete="off" onsubmit="this.querySelector('.btn-submit').disabled = true; this.querySelector('.btn-submit').innerText = 'Please wait...';">
        {% csrf_token %}
        <div class="form-group">
            <label>Email Address</label>
            <input type="email" name="email" required placeholder="Enter your email">
        </div>
        
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" required placeholder="Enter your password">
        </div>

        <div class="links" style="margin-bottom: 20px;">
            <a href="{% url 'forgot_password' %}">Forgot Password?</a>
        </div>
        
        <button type="submit" class="btn-submit">Sign In</button>
    </form>

    <div class="links" style="margin-top: 20px; justify-content: center; gap: 5px;">
        <span style="color: #aaa;">Don't have an account?</span> <a href="{% url 'register' %}">Sign Up</a>
    </div>

    <button class="google-btn" disabled style="opacity: 0.6; cursor: not-allowed;">
        <span>🔒 Continue with Google (Coming Soon)</span>
    </button>
</div>

</body>
</html>
