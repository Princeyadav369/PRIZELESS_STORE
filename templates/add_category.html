<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Category - Prizeless Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white flex items-center justify-center h-screen">

    <div class="bg-gray-800 p-8 rounded-2xl shadow-2xl w-[450px] border border-gray-700">
        <h1 class="text-2xl font-bold mb-2 text-center">Add New Category</h1>
        <p class="text-gray-400 text-sm mb-6 text-center">Create a new category for your products</p>

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2.5 rounded-lg transition shadow-lg mt-4">
                Save Category
            </button>
        </form>
        
        <div class="mt-4 text-center">
            <a href="/custom-dashboard/" class="text-sm text-gray-400 hover:text-white">&larr; Back to Dashboard</a>
        </div>
    </div>

</body>
</html>
